<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Student Management</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .header {
            background: #1f2937;
            color: white;
            padding: 20px 40px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .add-btn {
            background: #16a34a;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 5px;
        }

        .search-section {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        .search-section form {
            display: inline-block;
            margin-right: 15px;
        }

        input {
            padding: 9px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 9px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .search-btn {
            background: #2563eb;
            color: white;
        }

        .clear-btn {
            background: #6b7280;
            color: white;
        }

        .delete-all {
            background: #dc2626;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th {
            background: #374151;
            color: white;
            padding: 12px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        .edit {
            color: #2563eb;
            text-decoration: none;
            margin-right: 10px;
        }

        .delete {
            color: #dc2626;
            text-decoration: none;
        }

        .no-data {
            text-align: center;
            padding: 30px;
            background: white;
        }

    </style>

</head>

<body>

<div class="header">

    <h1>Student Management System</h1>

</div>


<div class="container">

    <div class="top-section">

        <h2>Student List</h2>

        <a href="/Students/add" class="add-btn">
            + Add Student
        </a>

    </div>


    <!-- Search Section -->

    <div class="search-section">

        <!-- Search by Roll Number -->

        <form action="/Students/search" method="get">

            <input
                    type="number"
                    name="rno"
                    placeholder="Enter Roll Number"
                    required>

            <button type="submit" class="search-btn">
                Search
            </button>

        </form>


        <!-- Search by Technology -->

        <form action="/Students/technology" method="get">

            <input
                    type="text"
                    name="technology"
                    placeholder="Enter Technology"
                    required>

            <button type="submit" class="search-btn">
                Filter
            </button>

        </form>


        <!-- Show All -->

        <a href="/Students">

            <button class="clear-btn">
                Show All
            </button>

        </a>

    </div>


    <!-- Student Table -->

    <table>

        <thead>

        <tr>

            <th>Roll Number</th>

            <th>Gender</th>

            <th>Name</th>

            <th>Technology</th>

            <th>Actions</th>

        </tr>

        </thead>


        <tbody>

        <tr th:each="student : ${students}">

            <td th:text="${student.rno}">
                101
            </td>

            <td th:text="${student.gender}">
                Male
            </td>

            <td th:text="${student.name}">
                Ravi
            </td>

            <td th:text="${student.technology}">
                Java
            </td>

            <td>

                <a
                        th:href="@{/Students/edit/{rno}(rno=${student.rno})}"
                        class="edit">

                    Edit

                </a>


                <a
                        th:href="@{/Students/delete/{rno}(rno=${student.rno})}"
                        class="delete"
                        onclick="return confirm('Are you sure you want to delete this student?');">

                    Delete

                </a>

            </td>

        </tr>

        </tbody>

    </table>


    <br>


    <a
            href="/Students/delete-all"
            class="delete-all"
            onclick="return confirm('Are you sure you want to delete ALL students?');">

        Delete All Students

    </a>

</div>

</body>

</html>
