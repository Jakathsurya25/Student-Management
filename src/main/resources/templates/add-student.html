<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Add Student</title>

    <style>

        body {
            font-family: Arial;
            background: #f4f6f9;
        }

        .container {
            width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Add Student</h1>


    <form
            th:action="@{/Students/add}"
            th:object="${student}"
            method="post">


        <label>Roll Number</label>

        <input
                type="number"
                th:field="*{rno}"
                required>


        <label>Gender</label>

        <select th:field="*{gender}" required>

            <option value="">
                Select Gender
            </option>

            <option value="Male">
                Male
            </option>

            <option value="Female">
                Female
            </option>

            <option value="Other">
                Other
            </option>

        </select>


        <label>Name</label>

        <input
                type="text"
                th:field="*{name}"
                required>


        <label>Technology</label>

        <input
                type="text"
                th:field="*{technology}"
                placeholder="Example: Java"
                required>


        <button type="submit">

            Add Student

        </button>

    </form>


    <a href="/Students" class="back">

        ← Back to Students

    </a>

</div>

</body>

</html>
